<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>約束？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Rajdhani", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .countdown {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 7.5vw, 6.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            text-align: center;
            padding: 1rem;
            white-space: nowrap;
        }

        .colon {
            margin: 0 0.2em;
            color: #555555;
            font-weight: 400;
            position: relative;
            top: -0.05em;
        }

        .unit {
            display: inline-block;
            min-width: 1.2ch;
        }

        #months {
            min-width: 2ch;
        }

        #days {
            min-width: 2ch;
        }

        #centiseconds {
            min-width: 2ch;
        }

        @media (max-width: 480px) {
            .countdown {
                font-size: clamp(1.3rem, 5.5vw, 2.2rem);
            }

            .colon {
                margin: 0 0.1em;
            }
        }
    </style>
</head>

<body>

    <div class="countdown">
        <span class="unit" id="months">00</span>
        <span class="colon">:</span>
        <span class="unit" id="days">00</span>
        <span class="colon">:</span>
        <span class="unit" id="hours">00</span>
        <span class="colon">:</span>
        <span class="unit" id="minutes">00</span>
        <span class="colon">:</span>
        <span class="unit" id="seconds">00</span>
        <span class="colon">:</span>
        <span class="unit" id="centiseconds">00</span>
    </div>

    <script>
        const targetDateObj = new Date('2030-06-01T00:00:00');
        const targetDate = targetDateObj.getTime();

        const monthsEl = document.getElementById('months');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const centisecondsEl = document.getElementById('centiseconds');

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now.getTime();

            if (difference <= 0) {
                monthsEl.textContent = '00';
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                centisecondsEl.textContent = '00';
                return;
            }

            let months = (targetDateObj.getFullYear() - now.getFullYear()) * 12 + (targetDateObj.getMonth() - now.getMonth());
            let anchor = new Date(now);
            anchor.setMonth(anchor.getMonth() + months);
            if (anchor.getTime() > targetDate) {
                months--;
                anchor = new Date(now);
                anchor.setMonth(anchor.getMonth() + months);
            }

            const remainingMs = targetDate - anchor.getTime();
            const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);
            const centiseconds = Math.floor((remainingMs % 1000) / 10);

            monthsEl.textContent = String(months).padStart(2, '0');
            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
            centisecondsEl.textContent = String(centiseconds).padStart(2, '0');

            requestAnimationFrame(updateCountdown);
        }

        requestAnimationFrame(updateCountdown);
    </script>
</body>

</html>
